<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Change password')}"></head>
<body th:attr="hx-headers=${'{&quot;' + _csrf.headerName + '&quot;:&quot;' + _csrf.token + '&quot;}'}">
<main class="card">
	<h1>Change password</h1>
	<form th:action="@{/account/password}" method="post" novalidate>
		<label for="currentPassword">Current password</label>
		<input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required>
		<p class="error" th:if="${errors['currentPassword']}" th:text="${errors['currentPassword']}"></p>

		<label for="newPassword">New password (12 to 128 characters)</label>
		<input id="newPassword" name="newPassword" type="password" autocomplete="new-password" required>
		<p class="error" th:if="${errors['newPassword']}" th:text="${errors['newPassword']}"></p>

		<label for="confirmPassword">Confirm new password</label>
		<input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required>
		<p class="error" th:if="${errors['confirmPassword']}" th:text="${errors['confirmPassword']}"></p>

		<button type="submit">Change password</button>
	</form>
	<p><a th:href="@{/}">Back</a></p>
</main>
</body>
</html>
