<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Team')}"></head>
<body th:attr="hx-headers=${'{&quot;' + _csrf.headerName + '&quot;:&quot;' + _csrf.token + '&quot;}'}">
<nav th:replace="~{fragments/layout :: nav('teams')}"></nav>
<main class="page">
	<p><a th:href="@{/admin/teams}">&larr; All teams</a></p>
	<div id="flash" aria-live="polite"></div>

	<section class="panel" id="team-header" th:fragment="header">
		<h1 th:text="${team.name}">Team</h1>
		<p class="muted" th:text="${team.description}">Description</p>
		<form th:if="${canRename}" th:action="@{/admin/teams/{id}/rename(id=${team.id})}" method="post" class="stack"
		      th:hx-post="@{/admin/teams/{id}/rename(id=${team.id})}" hx-target="#team-header" hx-swap="outerHTML">
			<label for="rename-name">Name</label>
			<input id="rename-name" name="name" type="text" maxlength="100" th:value="${form.name}" required>
			<p class="error" th:if="${errors['name']}" th:text="${errors['name']}"></p>
			<label for="rename-description">Description</label>
			<input id="rename-description" name="description" type="text" maxlength="500" th:value="${form.description}">
			<p class="error" th:if="${errors['description']}" th:text="${errors['description']}"></p>
			<button type="submit" class="btn-sm">Save</button>
		</form>
		<form th:if="${canRename}" th:action="@{/admin/teams/{id}/delete(id=${team.id})}" method="post" class="inline"
		      th:hx-post="@{/admin/teams/{id}/delete(id=${team.id})}" hx-confirm="Delete this team and all its memberships?">
			<button type="submit" class="btn-sm danger">Delete team</button>
		</form>
	</section>

	<section class="panel" id="team-members" th:fragment="members">
		<h2>Members</h2>
		<table>
			<thead><tr><th>Name</th><th>Email</th><th>Account role</th><th>Team role</th><th>Actions</th></tr></thead>
			<tbody>
			<tr th:each="row : ${rows}" th:id="${'member-' + row.member.userId}">
				<td th:text="${row.member.displayName}">Name</td>
				<td th:text="${row.member.email}">a@example.com</td>
				<td th:text="${row.member.accountRole}">MEMBER</td>
				<td><span class="badge" th:classappend="${row.member.teamRole.name() == 'LEAD'} ? 'ok'" th:text="${row.member.teamRole}">MEMBER</span></td>
				<td class="actions">
					<form th:if="${row.canChange}" method="post" class="inline"
					      th:action="@{/admin/teams/{id}/members/{uid}/role(id=${teamId},uid=${row.member.userId})}"
					      th:hx-post="@{/admin/teams/{id}/members/{uid}/role(id=${teamId},uid=${row.member.userId})}"
					      hx-target="#team-members" hx-swap="outerHTML">
						<select name="teamRole" aria-label="Team role">
							<option th:each="r : ${teamRoles}" th:value="${r}" th:text="${r}" th:selected="${r == row.member.teamRole}">MEMBER</option>
						</select>
						<button type="submit" class="btn-sm">Set</button>
					</form>
					<form th:if="${row.canChange}" method="post" class="inline"
					      th:action="@{/admin/teams/{id}/members/{uid}/remove(id=${teamId},uid=${row.member.userId})}"
					      th:hx-post="@{/admin/teams/{id}/members/{uid}/remove(id=${teamId},uid=${row.member.userId})}"
					      hx-target="#team-members" hx-swap="outerHTML" hx-confirm="Remove this member from the team?">
						<button type="submit" class="btn-sm danger">Remove</button>
					</form>
				</td>
			</tr>
			<tr th:if="${#lists.isEmpty(rows)}"><td colspan="5" class="muted">No members yet.</td></tr>
			</tbody>
		</table>
		<p class="pager" th:if="${memberPage.totalPages > 1}">
			<a th:if="${memberPage.hasPrevious()}" th:href="@{/admin/teams/{id}(id=${teamId},page=${memberPage.number - 1})}"
			   th:hx-get="@{/admin/teams/{id}/members(id=${teamId},page=${memberPage.number - 1})}"
			   hx-target="#team-members" hx-swap="outerHTML">Previous</a>
			<span th:text="${'Page ' + (memberPage.number + 1) + ' of ' + memberPage.totalPages}">Page 1 of 1</span>
			<a th:if="${memberPage.hasNext()}" th:href="@{/admin/teams/{id}(id=${teamId},page=${memberPage.number + 1})}"
			   th:hx-get="@{/admin/teams/{id}/members(id=${teamId},page=${memberPage.number + 1})}"
			   hx-target="#team-members" hx-swap="outerHTML">Next</a>
		</p>

		<form th:if="${canManageMembers}" th:action="@{/admin/teams/{id}/members(id=${teamId})}" method="post" class="stack add-member"
		      th:hx-post="@{/admin/teams/{id}/members(id=${teamId})}" hx-target="#team-members" hx-swap="outerHTML">
			<h3>Add a member</h3>
			<label for="member-search">Find a user</label>
			<input id="member-search" name="q" type="search" placeholder="Type a name or email" autocomplete="off"
			       th:hx-get="@{/admin/users/search(enabledOnly=true)}" hx-trigger="keyup changed delay:300ms, load"
			       hx-target="#member-user" hx-swap="innerHTML">
			<label for="member-user">User</label>
			<select id="member-user" name="userId" required></select>
			<label for="member-role">Team role</label>
			<select id="member-role" name="teamRole">
				<option th:each="r : ${teamRoles}" th:value="${r}" th:text="${r}" th:selected="${r.name() == 'MEMBER'}">MEMBER</option>
			</select>
			<button type="submit" class="btn">Add to team</button>
		</form>
	</section>
</main>
</body>
</html>
