<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Something went wrong</title>
	<style>
		body { font-family: system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; background: #f6f7f9; color: #1f2933; }
		main { text-align: center; padding: 2rem; }
		h1 { font-size: 4rem; margin: 0; }
		a { color: #2563eb; }
	</style>
</head>
<body th:attr="hx-headers=${_csrf != null} ? ${'{&quot;' + _csrf.headerName + '&quot;:&quot;' + _csrf.token + '&quot;}'}">
<main>
	<h1 th:text="${status}">500</h1>
	<p th:text="${message}">An unexpected error occurred</p>
	<p><a href="/">Back to home</a></p>
</main>
</body>
</html>
