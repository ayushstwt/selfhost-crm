<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sign in')}"></head>
<body th:attr="hx-headers=${'{&quot;' + _csrf.headerName + '&quot;:&quot;' + _csrf.token + '&quot;}'}">
<main class="card">
	<h1>Sign in</h1>
	<p class="notice" th:if="${param.logout}">You have been signed out.</p>
	<p class="notice" th:if="${param.setup}">Setup complete. Sign in with your new administrator account.</p>
	<p class="notice" th:if="${param.invited}">Your account is ready. Sign in below.</p>
	<p class="error" th:if="${param.error}">Invalid email or password.</p>
	<p class="error" th:if="${param.disabled}">This account is disabled.</p>
	<form th:action="@{/login}" method="post">
		<label for="username">Email</label>
		<input id="username" name="username" type="email" autocomplete="username" required autofocus>
		<label for="password">Password</label>
		<input id="password" name="password" type="password" autocomplete="current-password" required>
		<button type="submit">Sign in</button>
	</form>
</main>
</body>
</html>
